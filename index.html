<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hayvanat Bahçem</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8ccf83;font-family:Arial,sans-serif;color:white;touch-action:none}
#game{position:fixed;inset:0}
#loading{position:fixed;inset:0;z-index:50;background:#173e2a;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px}
#loading h1{font-size:30px}
#retry{display:none}
#hud{position:fixed;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
.pill{background:#143b2be8;padding:10px 12px;border-radius:13px;font-size:13px;box-shadow:0 3px 10px #0003}
button{border:0;border-radius:12px;padding:12px;background:#f4cf70;color:#233b28;font-weight:bold;font-size:13px;box-shadow:0 3px 9px #0003}
#menu{position:fixed;right:10px;top:61px;display:flex;flex-direction:column;gap:8px}
#menu button{background:#17462f;color:white}
#notice{position:fixed;top:112px;left:50%;transform:translateX(-50%);background:#163e2c;padding:11px 15px;border-radius:12px;display:none;text-align:center;max-width:90%;z-index:5}
#joystick{position:fixed;left:20px;bottom:24px;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,#ffffff28,#102e274c);border:2px solid #ffffff9c;box-shadow:inset 0 0 18px #0002,0 4px 18px #0003;touch-action:none}
#knob{position:absolute;width:54px;height:54px;left:37px;top:37px;border-radius:50%;background:linear-gradient(145deg,#ffffffef,#c5d9cc);border:2px solid white;box-shadow:0 4px 12px #0004;pointer-events:none}
#lookHint{position:fixed;right:10px;bottom:22px;padding:8px 10px;border-radius:10px;background:#143b2bbd;font-size:11px;pointer-events:none}
#actions{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);display:flex;gap:7px;white-space:nowrap}
#panel{position:fixed;inset:0;z-index:10;background:#061b12cc;display:none;align-items:center;justify-content:center;padding:18px}
#panelCard{width:min(350px,100%);background:#17462f;border-radius:20px;padding:20px}
.animalBtn{display:block;width:100%;margin:9px 0;text-align:left}
#close{background:#dce8dd}
@media(max-width:430px){#actions{bottom:170px}#actions button{padding:10px 8px;font-size:12px}.pill{font-size:12px;padding:9px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><h1>🌳 Hayvanat Bahçem</h1><p id="loadText">Doğal yaşam alanı hazırlanıyor...</p><button id="retry">Tekrar dene</button></div>
<div id="hud">
 <div class="pill">🌿 Hayvanat Bahçem</div>
 <div class="pill">🪙 <span id="money">500</span></div>
 <div class="pill">👥 <span id="visitorCount">0</span></div>
</div>
<div id="menu">
 <button id="animals">🐾 Hayvanlar</button>
 <button id="earn">🎟️ Bilet gişesi</button>
</div>
<div id="notice"></div>
<div id="joystick"><div id="knob"></div></div>
<div id="lookHint">Sağ tarafı sürükle: etrafa bak</div>
<div id="actions">
 <button id="inspect">🔎 İncele</button>
 <button id="feed">🥕 Besle · 10</button>
</div>
<div id="panel"><div id="panelCard">
 <h2>🐾 Hayvan satın al</h2>
 <p>Bahçeni yeni hayvanlarla büyüt.</p>
 <button class="animalBtn" data-animal="lion" data-cost="150">🦁 Aslan — 150 🪙</button>
 <button class="animalBtn" data-animal="elephant" data-cost="200">🐘 Fil — 200 🪙</button>
 <button class="animalBtn" data-animal="flamingo" data-cost="80">🦩 Flamingo — 80 🪙</button>
 <button class="animalBtn" data-animal="panda" data-cost="180">🐼 Panda — 180 🪙</button>
 <button id="close">Kapat</button>
</div></div>
<script>
let THREE,scene,camera,renderer,clock;
let money=500,animals=[],visitors=[];
let joyX=0,joyY=0,yaw=0,pitch=0;
let keys={},dragging=false,lastX=0,lastY=0;
let lastSpawn=0,ticketTime=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
function msg(t){
 $('notice').textContent=t;$('notice').style.display='block';
 clearTimeout(msg.timer);msg.timer=setTimeout(()=>$('notice').style.display='none',2300);
}
function setMoney(v){money=v;$('money').textContent=money}
function material(color,roughness=1){return new THREE.MeshStandardMaterial({color,roughness})}
function ball(p,x,y,z,sx,sy,sz,c){
 let m=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),material(c));
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;
}
function box(p,x,y,z,sx,sy,sz,c){
 let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material(c));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;
}
function cyl(p,x,y,z,r1,r2,h,c,n=10){
 let m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),material(c));
 m.position.set(x,y,z);m.castShadow=true;p.add(m);return m;
}
function path(points,width,color){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],.025,p[1])));
 const steps=points.length*22, verts=[],inds=[];
 for(let i=0;i<=steps;i++){
  const t=i/steps,pt=curve.getPoint(t),tan=curve.getTangent(t);
  const nx=-tan.z,nz=tan.x,len=Math.hypot(nx,nz)||1;
  verts.push(pt.x+nx/len*width/2,pt.y,pt.z+nz/len*width/2);
  verts.push(pt.x-nx/len*width/2,pt.y,pt.z-nz/len*width/2);
  if(i<steps){let a=i*2;inds.push(a,a+1,a+2,a+1,a+3,a+2)}
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
 geo.setIndex(inds);geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,roughness:1,side:THREE.DoubleSide}));
 mesh.receiveShadow=true;scene.add(mesh);
}
function tree(x,z,s=1){
 const g=new THREE.Group();
 cyl(g,0,s,0,.16*s,.24*s,2*s,0x765036);
 ball(g,0,2.25*s,0,.9*s,1.15*s,.9*s,0x367a3b);
 ball(g,-.45*s,2.05*s,.12,.58*s,.7*s,.6*s,0x4d9148);
 ball(g,.5*s,2.3*s,-.1,.62*s,.75*s,.62*s,0x2c6836);
 g.position.set(x,0,z);scene.add(g);
}
function fence(x,z,w,d){
 const wood=0x91613b;
 for(let xx=-w/2;xx<=w/2+.01;xx+=1.4){
  box(scene,x+xx,.62,z-d/2,.12,1.24,.12,wood);
  box(scene,x+xx,.62,z+d/2,.12,1.24,.12,wood);
 }
 for(let zz=-d/2;zz<=d/2+.01;zz+=1.4){
  box(scene,x-w/2,.62,z+zz,.12,1.24,.12,wood);
  box(scene,x+w/2,.62,z+zz,.12,1.24,.12,wood);
 }
 for(const y of [.38,.94]){
  box(scene,x,y,z-d/2,w,.1,.1,wood);
  box(scene,x,y,z+d/2,w,.1,.1,wood);
  box(scene,x-w/2,y,z,.1,.1,d,wood);
  box(scene,x+w/2,y,z,.1,.1,d,wood);
 }
}
function animal(type,x,z){
 const g=new THREE.Group(),colors={lion:0xc18a43,elephant:0x858f91,flamingo:0xf18da0,panda:0xf0eee4};
 const c=colors[type]||0xc18a43;
 if(type==='lion'){
  ball(g,0,1.05,0,.65,.58,.82,c);ball(g,0,1.25,.56,.43,.4,.42,0xd9b77d);
  ball(g,0,1.58,-.18,.62,.62,.6,0x8c4a22);ball(g,0,1.6,-.18,.48,.48,.48,c);
  ball(g,-.14,1.3,.91,.05,.05,.04,0x111111);ball(g,.14,1.3,.91,.05,.05,.04,0x111111);
  for(const [a,b] of [[-.4,.5],[.4,.5],[-.4,-.48],[.4,-.48]])cyl(g,a,.32,b,.12,.15,.55,c);
  cyl(g,.03,.65,-.83,.04,.07,.65,0x8c4a22);
 }else if(type==='elephant'){
  ball(g,0,1.25,0,.8,.78,1,c);ball(g,0,1.7,.68,.52,.52,.5,c);
  ball(g,-.54,1.6,.58,.34,.42,.12,0x777f82);ball(g,.54,1.6,.58,.34,.42,.12,0x777f82);
  cyl(g,0,1.12,1.08,.14,.22,.72,c,12).rotation.x=-.2;
  for(const a of [-.48,.48])for(const b of [-.6,.6])box(g,a,.35,b,.26,.65,.28,0x777f82);
  ball(g,0,1.8,1.02,.06,.06,.05,0x171717);
 }else if(type==='flamingo'){
  ball(g,0,.68,0,.3,.4,.4,c);cyl(g,0,1.1,.15,.07,.1,.7,c);
  ball(g,0,1.5,.15,.2,.2,.2,c);
  cyl(g,.12,1.48,.34,.025,.055,.22,0xe6a45d).rotation.x=Math.PI/2;
  cyl(g,-.1,.27,0,.03,.04,.5,c);cyl(g,.1,.27,.05,.03,.04,.5,c);
 }else{
  ball(g,0,1.05,0,.56,.62,.56,0xf0eee4);ball(g,0,1.65,.1,.43,.42,.42,0xf0eee4);
  ball(g,-.29,1.93,.1,.14,.16,.12,0x151515);ball(g,.29,1.93,.1,.14,.16,.12,0x151515);
  ball(g,-.15,1.72,.48,.11,.16,.06,0x111111);ball(g,.15,1.72,.48,.11,.16,.06,0x111111);
  ball(g,0,1.58,.5,.08,.06,.05,0x111111);
  for(const a of [-.35,.35])for(const b of [-.3,.3])cyl(g,a,.28,b,.12,.14,.48,0x222222);
 }
 g.position.set(x,0,z);g.userData.type=type;scene.add(g);animals.push(g);return g;
}
function lamp(x,z){
 cyl(scene,x,1.6,z,.07,.1,3.2,0x34433b);
 ball(scene,x,3.3,z,.22,.22,.22,0xffe7a2);
}
function bench(x,z){
 box(scene,x,.52,z,1.8,.15,.55,0x98623b);
 box(scene,x,.82,z-.23,1.8,.55,.12,0x98623b);
 for(const dx of [-.65,.65])for(const dz of [-.18,.18])box(scene,x+dx,.26,z+dz,.12,.5,.12,0x51402c);
}
function makePerson(shirt,pants,skin){
 const g=new THREE.Group();
 // baş, gövde, kollar ve hareket eden bacaklar
 ball(g,0,1.64,0,.17,.18,.17,skin);
 ball(g,0,1.29,0,.24,.32,.15,shirt);
 const legs=[];
 for(const side of [-1,1]){
  const leg=cyl(g,side*.095,.78,0,.075,.09,.48,pants,8);
  legs.push(leg);
  cyl(g,side*.29,1.3,0,.055,.065,.42,shirt,8).rotation.z=side*.12;
  ball(g,side*.29,1.08,0,.065,.065,.065,skin);
  ball(g,side*.095,.48,.05,.085,.08,.15,0x393b3c);
 }
 g.userData.legs=legs;g.userData.phase=Math.random()*6;
 return g;
}
const route=[
 [0,12],[0,7],[0,1],[0,-5],[0,-17],[0,-25],[0,-34],
 [7,-34],[14,-31],[19,-24],[19,-16],[19,-7],[12,-3],
 [6,-7],[0,-12],[-7,-15],[-14,-12],[-19,-7],[-19,-15],
 [-19,-25],[-13,-31],[-5,-34],[0,-27],[0,-12],[0,2],[0,12]
];
function addVisitor(){
 if(visitors.length>=24)return;
 const colors=[0x4b83bf,0xe6a04c,0x9b79bd,0x4f9c80,0xe6e1d5,0xc66e69];
 const shirt=colors[Math.floor(Math.random()*colors.length)];
 const g=makePerson(shirt,0x344052,[0xe4b58b,0xc78d66,0x80563d][Math.floor(Math.random()*3)]);
 g.position.set((Math.random()-.5)*1.5,0,13+Math.random()*2);
 scene.add(g);
 visitors.push({g,index:Math.floor(Math.random()*2),speed:1.05+Math.random()*.45,wait:0});
 $('visitorCount').textContent=visitors.length;
}
function createWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9bd9f5);
 scene.fog=new THREE.Fog(0x9bd9f5,45,115);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,250);
 camera.position.set(0,1.7,15);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'default'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 $('game').replaceChildren(renderer.domElement);
 clock=new THREE.Clock();
 scene.add(new THREE.HemisphereLight(0xe5f5ff,0x657c40,2));
 const sun=new THREE.DirectionalLight(0xffedcc,2.1);
 sun.position.set(-18,28,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),material(0x73b95f));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.09;ground.receiveShadow=true;scene.add(ground);

 // Kıvrımlı, bordürlü yollar
 const main=[[0,16],[0,10],[1,5],[0,0],[0,-7],[1,-13],[0,-20],[0,-27],[0,-36]];
 path(main,7,0x9b8b70);path(main,6.25,0xd0bd98);
 const left=[[0,0],[-4,-3],[-9,-5],[-14,-7],[-19,-9],[-20,-15],[-18,-22],[-12,-26],[-5,-29],[0,-27]];
 path(left,5.2,0x96866e);path(left,4.5,0xd1bd97);
 const right=[[0,-2],[5,-4],[10,-6],[15,-8],[20,-11],[21,-17],[18,-23],[12,-27],[5,-29],[0,-27]];
 path(right,5.2,0x96866e);path(right,4.5,0xd1bd97);
 const branch=[[0,5],[5,3],[10,2],[15,3],[20,6]];
 path(branch,3.8,0x98886e);path(branch,3.1,0xd4c29c);

 // Bordür taşları ve çevre
 for(let z=-34;z<15;z+=1.5){
  box(scene,-3.7,.12,z,.16,.2,.38,0x8e9188);
  box(scene,3.7,.12,z,.16,.2,.38,0x8e9188);
 }
 for(let z=-40;z<40;z+=4){
  tree(-28-Math.random()*7,z,.7+Math.random()*.6);
  tree(28+Math.random()*7,z,.7+Math.random()*.6);
 }
 for(let i=0;i<42;i++){
  let x=(Math.random()-.5)*65,z=(Math.random()-.5)*75;
  if(Math.abs(x)<5||Math.abs(x-19)<7||Math.abs(x+19)<7)continue;
  if(z>-1&&z<15)continue;
  tree(x,z,.55+Math.random()*.65);
 }
 // Gölet
 const pond=new THREE.Mesh(new THREE.CircleGeometry(4.6,36),new THREE.MeshStandardMaterial({color:0x47b9d4,roughness:.22,metalness:.12}));
 pond.rotation.x=-Math.PI/2;pond.position.set(-10,.025,-8);scene.add(pond);
 for(let i=0;i<18;i++){let a=i/18*Math.PI*2;ball(scene,-10+Math.cos(a)*4.9,.12,-8+Math.sin(a)*4.9,.3,.16,.25,0x9da78a)}
 // Hayvan alanları
 fence(0,-8,13,12);fence(19,-8,12,12);fence(-19,-8,11,12);fence(0,-29,13,12);fence(19,-29,12,12);
 animal('lion',-2,-8);animal('elephant',18,-8);animal('flamingo',-19,-8);animal('panda',1,-29);animal('flamingo',19,-29);
 // Giriş binası ve bilet gişesi
 box(scene,0,2,16,8,.4,.6,0x75492d);
 box(scene,-3.6,1,16,.35,2,.55,0x75492d);box(scene,3.6,1,16,.35,2,.55,0x75492d);
 box(scene,0,1.1,14,2.4,1.3,.9,0xb87543);
 box(scene,0,1.85,14,.6,.18,.95,0xf2cf74);
 // Banklar, lambalar, çöp kutuları
 for(const [x,z] of [[7,3],[-7,-2],[7,-18],[-8,-25],[10,-30]])bench(x,z);
 for(const [x,z] of [[-4,7],[4,0],[-4,-13],[4,-23],[-24,-3],[24,-2]])lamp(x,z);
 for(const [x,z] of [[4,5],[-4,-4],[8,-20],[-8,-22]]){
  cyl(scene,x,.48,z,.2,.24,.85,0x315e55);
  cyl(scene,x,.92,z,.22,.22,.08,0x233c36);
 }
 for(let i=0;i<7;i++)addVisitor();
 lastSpawn=performance.now();
 $('loading').style.display='none';
 msg('Ziyaretçiler gelmeye başladı! Joystick ile gez.');
}
function update(){
 const dt=Math.min(clock.getDelta(),.05),now=performance.now();
 // Akıcı joystick ve kamera
 let f=-joyY,s=joyX;
 if(keys.w||keys.arrowup)f+=1;if(keys.s||keys.arrowdown)f-=1;
 if(keys.d||keys.arrowright)s+=1;if(keys.a||keys.arrowleft)s-=1;
 const len=Math.hypot(f,s);if(len>1){f/=len;s/=len}
 const speed=6.3*dt;
 camera.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed;
 camera.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;
 camera.position.x=clamp(camera.position.x,-75,75);
 camera.position.z=clamp(camera.position.z,-75,75);
 camera.position.y=1.7;
 camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;

 // Ziyaretçiler yolları takip eder, zaman zaman hayvanları seyreder
 for(const v of visitors){
  const g=v.g;
  if(v.wait>0){v.wait-=dt;continue}
  let target=route[v.index];
  let dx=target[0]-g.position.x,dz=target[1]-g.position.z;
  const d=Math.hypot(dx,dz);
  if(d<.65){
   v.index=(v.index+1)%route.length;
   if(Math.random()<.18)v.wait=1.5+Math.random()*2;
   continue;
  }
  const step=Math.min(d,v.speed*dt);
  g.position.x+=dx/d*step;g.position.z+=dz/d*step;
  g.rotation.y=Math.atan2(dx,dz);
  const swing=Math.sin(now*.009+g.userData.phase)*.45;
  g.userData.legs[0].rotation.x=swing;g.userData.legs[1].rotation.x=-swing;
 }
 if(now-lastSpawn>6500&&visitors.length<24){addVisitor();lastSpawn=now}
 if(now-ticketTime>15000&&visitors.length>0){
  setMoney(money+10);ticketTime=now;
 }
 $('visitorCount').textContent=visitors.length;
 renderer.render(scene,camera);
}
let running=false;
async function start(){
 try{
  $('loadText').textContent='3D dünya yükleniyor...';
  $('retry').style.display='none';
  THREE=await import('https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js');
  createWorld();
  if(!running){running=true;function loop(){requestAnimationFrame(loop);update()}loop()}
 }catch(e){
  console.error(e);
  $('loadText').textContent='Açılamadı: '+(e.message||'İnternet veya 3D desteği hatası');
  $('retry').style.display='block';
 }
}
$('retry').onclick=()=>location.reload();
window.addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// Hassas, merkeze dönen analog joystick
const stick=$('joystick'),knob=$('knob');let active=false;
function moveStick(e){
 if(!active)return;
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=43,d=Math.hypot(dx,dy),scale=d>max?max/d:1;
 dx*=scale;dy*=scale;
 if(Math.hypot(dx,dy)<5){joyX=0;joyY=0}else{joyX=dx/max;joyY=dy/max}
 knob.style.left=(r.width/2-27+dx)+'px';knob.style.top=(r.height/2-27+dy)+'px';
}
stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',moveStick);
function releaseStick(){active=false;joyX=0;joyY=0;knob.style.left='37px';knob.style.top='37px'}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);

// Ekranın sağında kamera kontrolü
document.addEventListener('pointerdown',e=>{
 if(e.clientX>innerWidth*.42&&!e.target.closest('button')&&!e.target.closest('#joystick')&&!e.target.closest('#panel')){
  dragging=true;lastX=e.clientX;lastY=e.clientY;
 }
});
document.addEventListener('pointermove',e=>{
 if(!dragging)return;
 yaw-=(e.clientX-lastX)*.0045;
 pitch=clamp(pitch-(e.clientY-lastY)*.0035,-1.05,1.05);
 lastX=e.clientX;lastY=e.clientY;
});
document.addEventListener('pointerup',()=>dragging=false);
document.addEventListener('pointercancel',()=>dragging=false);

$('animals').onclick=()=>$('panel').style.display='flex';
$('close').onclick=()=>$('panel').style.display='none';
document.querySelectorAll('.animalBtn').forEach(b=>b.onclick=()=>{
 const cost=Number(b.dataset.cost),type=b.dataset.animal;
 if(money<cost){msg('Yeterli paran yok!');return}
 setMoney(money-cost);
 animal(type,camera.position.x-Math.sin(yaw)*5,camera.position.z-Math.cos(yaw)*5);
 $('panel').style.display='none';msg('Yeni hayvanın bahçene eklendi!');
});
$('earn').onclick=()=>{setMoney(money+50);msg('Bilet gişesinden 50 altın kazandın!')};
$('inspect').onclick=()=>{
 let nearest=null,best=Infinity;
 animals.forEach(a=>{let d=Math.hypot(a.position.x-camera.position.x,a.position.z-camera.position.z);if(d<best){best=d;nearest=a}});
 const names={lion:'Aslan',elephant:'Fil',flamingo:'Flamingo',panda:'Panda'};
 msg(nearest&&best<12?names[nearest.userData.type]+' · '+best.toFixed(1)+' metre':'Yakında hayvan yok. Çitli alanlara yaklaş.');
};
$('feed').onclick=()=>{
 if(money<10){msg('Beslemek için 10 altın gerekiyor.');return}
 let nearest=null,best=Infinity;
 animals.forEach(a=>{let d=Math.hypot(a.position.x-camera.position.x,a.position.z-camera.position.z);if(d<best){best=d;nearest=a}});
 if(nearest&&best<12){setMoney(money-10);msg('Hayvanı besledin! 🥕')}
 else msg('Önce bir hayvana yaklaş.');
};
start();
</script>
</body>
</html>
