<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hayvanat Bahçem</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#b9e5ff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:8px;left:8px;z-index:5;background:#173b29eF;color:white;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.6;pointer-events:none}
#help{position:fixed;right:8px;top:8px;z-index:5;background:#ffffffed;color:#173b29;padding:8px;border-radius:10px;font-size:11px;max-width:140px}
#joystick{position:fixed;bottom:20px;left:18px;width:120px;height:120px;border:3px solid white;background:#ffffff70;border-radius:50%;z-index:10;touch-action:none}
#stick{position:absolute;width:48px;height:48px;left:33px;top:33px;border:3px solid white;border-radius:50%;background:#27794b;pointer-events:none}
#zoom{position:fixed;right:14px;bottom:20px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:7px}
.zbtn{width:48px;height:48px;border:0;border-radius:14px;background:#173b29;color:white;font-size:28px;font-weight:bold}
#zoomlabel{background:#ffffffdf;padding:5px 7px;border-radius:8px;font-size:11px}
#message{display:none;position:fixed;bottom:155px;left:50%;transform:translateX(-50%);z-index:8;background:#173b29ed;color:white;padding:10px 14px;border-radius:12px;text-align:center;font-size:14px;max-width:85vw}
#shop{display:none;position:fixed;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:min(340px,90vw);padding:18px;background:white;border-radius:18px;color:#173b29;box-shadow:0 5px 30px #0006}
#close{float:right;border:0;padding:7px;border-radius:8px}
.buy{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:#27824c;color:white;font-weight:bold;font-size:15px}
</style>
</head>
<body>
<div id="hud">
<b>🐾 HAYVANAT BAHÇEM</b><br>
💰 Para: <span id="money">1000</span><br>
🐾 Hayvanlar: <span id="count">4</span><br>
⭐ Seviye: <span id="level">1</span>
</div>
<div id="help">Joystick ile yürü. Hayvan bölmesine yaklaş ve ekrana dokun. Telefonu yatay tutabilirsin.</div>
<div id="joystick"><div id="stick"></div></div>
<div id="zoom">
<button class="zbtn" id="zin">+</button>
<div id="zoomlabel">Yakınlaştır</div>
<button class="zbtn" id="zout">−</button>
</div>
<div id="message"></div>
<div id="shop">
<button id="close">Kapat ✕</button>
<h3 id="shopTitle">Hayvan bölmesi</h3>
<p id="shopText"></p>
<div id="shopButtons"></div>
</div>

<canvas id="game"></canvas>
<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

let W=innerWidth,H=innerHeight,DPR=1;
function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=Math.round(W*DPR);
 canvas.height=Math.round(H*DPR);
 canvas.style.width=W+'px';
 canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
resize();

const player={x:0,y:12,dir:0};
let zoom=1;
let money=1000;
let joyX=0,joyY=0,joyActive=false,pointerId=null;
let messageTimer=null;

const pens=[
 {id:'lion',x:-28,y:-19,w:16,h:16,name:'Aslan',emoji:'🦁',price:450,owned:false,animals:[]},
 {id:'rabbit',x:28,y:-19,w:16,h:16,name:'Tavşan',emoji:'🐰',price:150,owned:true,animals:[{x:25,y:-20},{x:30,y:-17}]},
 {id:'elephant',x:-28,y:19,w:16,h:16,name:'Fil',emoji:'🐘',price:600,owned:false,animals:[]},
 {id:'turtle',x:28,y:19,w:16,h:16,name:'Kaplumbağa',emoji:'🐢',price:200,owned:true,animals:[{x:26,y:18},{x:30,y:21}]}
];
const trees=[];
for(let y=-42;y<=42;y+=9){trees.push({x:-43,y},{x:43,y})}
for(let x=-34;x<=34;x+=11){trees.push({x,y:-44},{x,y:44})}

const buffet={x:0,y:-13};
const randDecor=[
 {x:-9,y:-7},{x:9,y:-7},{x:-10,y:8},{x:10,y:8},
 {x:-15,y:0},{x:15,y:0}
];

function roundedRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}
function textAt(text,x,y,size=1){
 ctx.font=(12*size)+'px Arial';
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillStyle='#173b29';
 ctx.fillText(text,x,y);
}
function drawGround(){
 ctx.fillStyle='#72bd50';
 ctx.fillRect(-100,-100,200,200);

 // Yollar
 ctx.fillStyle='#d7c49a';
 ctx.fillRect(-3,-50,6,100);
 ctx.fillRect(-50,-3,100,6);
 ctx.fillRect(-19,-32,2.5,64);
 ctx.fillRect(17,-32,2.5,64);

 // Küçük çimen desenleri
 ctx.fillStyle='#65ad46';
 for(let x=-38;x<=38;x+=7){
  for(let y=-36;y<=36;y+=8){
   if(Math.abs(x)>5||Math.abs(y)>5)ctx.fillRect(x,y,.7,.7);
  }
 }
}
function drawTree(t){
 ctx.fillStyle='#69452a';
 ctx.fillRect(t.x-.28,t.y-.1,.56,1.3);
 ctx.fillStyle='#287b38';
 ctx.beginPath();ctx.arc(t.x,t.y-.45,1.15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#419447';
 ctx.beginPath();ctx.arc(t.x-.3,t.y-.8,.55,0,Math.PI*2);ctx.fill();
}
function drawPen(p){
 const x=p.x-p.w/2,y=p.y-p.h/2;
 ctx.fillStyle='#55963e';
 ctx.fillRect(x,y,p.w,p.h);

 // Bölme zemini
 ctx.strokeStyle='#79502d';
 ctx.lineWidth=.22;
 ctx.strokeRect(x,y,p.w,p.h);
 ctx.lineWidth=.12;
 for(let i=1;i<12;i++){
  const xx=x+i*p.w/12;
  ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+p.h);ctx.stroke();
 }
 for(let yy of [y+1,y+p.h-1]){
  ctx.lineWidth=.22;
  ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+p.w,yy);ctx.stroke();
 }
 // Giriş boşluğu
 ctx.fillStyle='#d7c49a';
 ctx.fillRect(p.x-.8,y+p.h-.2,1.6,.5);

 textAt(p.emoji,p.x,p.y-.3,1.5);
 textAt(p.name,p.x,p.y+2.4,.9);
 if(!p.owned){
  roundedRect(p.x-3,p.y+3.3,6,1.6,.3,'#173b29');
  textAt(p.price+' 💰',p.x,p.y+4.1,.8);
 }
}
function drawBuffet(){
 roundedRect(-3,-15.3,6,4.3,.3,'#9a6238');
 ctx.fillStyle='#e9c44d';
 ctx.fillRect(-3.2,-15.5,6.4,.65);
 textAt('🍔 BÜFE',0,-13.2,1);
}
function drawAnimal(emoji,x,y){
 ctx.fillStyle='#0002';
 ctx.beginPath();ctx.ellipse(x,y+.55,.8,.35,0,0,Math.PI*2);ctx.fill();
 textAt(emoji,x,y,1.45);
}
function drawPlayer(){
 // Gölge
 ctx.fillStyle='#0003';
 ctx.beginPath();ctx.ellipse(player.x,player.y+.55,.65,.28,0,0,Math.PI*2);ctx.fill();
 // Oyuncu gövdesi ve başı
 ctx.fillStyle='#287ed0';
 ctx.beginPath();ctx.arc(player.x,player.y,.55,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f0bd91';
 ctx.beginPath();ctx.arc(player.x,player.y-.7,.36,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#173b29';ctx.lineWidth=.12;
 ctx.beginPath();
 ctx.moveTo(player.x,player.y);
 ctx.lineTo(player.x+Math.sin(player.dir)*.7,player.y+Math.cos(player.dir)*.7);
 ctx.stroke();
}
function drawWorld(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#b9e5ff';ctx.fillRect(0,0,W,H);

 const scale=zoom*Math.min(W,H)/42;
 ctx.save();
 ctx.translate(W/2-player.x*scale,H/2-player.y*scale);
 ctx.scale(scale,scale);

 drawGround();
 for(const t of trees)drawTree(t);
 for(const p of pens)drawPen(p);
 drawBuffet();
 for(const p of pens){
  for(const a of p.animals)drawAnimal(p.emoji,a.x,a.y);
 }
 for(const d of randDecor){
  textAt('🌼',d.x,d.y,.8);
 }
 drawPlayer();

 ctx.restore();
}
function animalCount(){
 return pens.reduce((sum,p)=>sum+p.animals.length,0);
}
function refresh(){
 document.getElementById('money').textContent=money;
 document.getElementById('count').textContent=animalCount();
 document.getElementById('level').textContent=Math.max(1,Math.floor(animalCount()/2)+1);
}
function say(message){
 const el=document.getElementById('message');
 el.textContent=message;
 el.style.display='block';
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>el.style.display='none',2200);
}
function openShop(title,description,buttons){
 document.getElementById('shopTitle').textContent=title;
 document.getElementById('shopText').textContent=description;
 const area=document.getElementById('shopButtons');
 area.innerHTML='';
 for(const b of buttons){
  const button=document.createElement('button');
  button.className='buy';
  button.textContent=b.label;
  button.onclick=b.action;
  area.appendChild(button);
 }
 document.getElementById('shop').style.display='block';
}
document.getElementById('close').onclick=()=>{
 document.getElementById('shop').style.display='none';
};

function nearestTarget(){
 let best=null,bestDist=Infinity;
 for(const p of pens){
  const d=Math.hypot(player.x-p.x,player.y-p.y);
  if(d<bestDist){bestDist=d;best={pen:p,distance:d};}
 }
 const bd=Math.hypot(player.x-buffet.x,player.y-buffet.y);
 if(bd<bestDist)best={buffet:true,distance:bd};
 return best;
}
function interact(){
 const target=nearestTarget();
 if(!target||target.distance>12){
  say('Bir hayvan bölmesine veya büfeye yaklaş!');
  return;
 }
 if(target.buffet){
  openShop('🍔 Bahçe Büfesi','Büfeden para kazanabilirsin.',[
   {label:'+100 para kazan',action:()=>{
    money+=100;refresh();
    document.getElementById('shop').style.display='none';
    say('+100 para kazandın!');
   }}
  ]);
  return;
 }
 const p=target.pen;
 if(p.owned){
  openShop(p.emoji+' '+p.name,'Hayvanlarınla ilgilen.',[
   {label:'Hayvanlara bak: +50 para',action:()=>{
    money+=50;refresh();
    document.getElementById('shop').style.display='none';
    say('+50 para kazandın!');
   }}
  ]);
 }else{
  openShop(p.emoji+' '+p.name,'Bu hayvanı satın almak ister misin?',[
   {label:'Satın al: '+p.price+' para',action:()=>{
    if(money<p.price){say('Yeterli paran yok!');return;}
    money-=p.price;
    p.owned=true;
    p.animals.push({x:p.x-1,y:p.y},{x:p.x+1,y:p.y+1});
    refresh();
    document.getElementById('shop').style.display='none';
    say(p.name+' satın alındı!');
   }}
  ]);
 }
}

// Joystick kontrolleri
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');

function moveStick(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=34;
 const len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 joyX=dx/max;
 joyY=dy/max;
 stick.style.left=(33+dx)+'px';
 stick.style.top=(33+dy)+'px';
}
function resetStick(){
 joyActive=false;
 pointerId=null;
 joyX=0;joyY=0;
 stick.style.left='33px';
 stick.style.top='33px';
}
joystick.addEventListener('pointerdown',e=>{
 e.preventDefault();
 joyActive=true;
 pointerId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moveStick(e);
});
joystick.addEventListener('pointermove',e=>{
 if(joyActive&&e.pointerId===pointerId)moveStick(e);
});
joystick.addEventListener('pointerup',resetStick);
joystick.addEventListener('pointercancel',resetStick);

// Yakınlaştırma
document.getElementById('zin').addEventListener('click',()=>{
 zoom=Math.min(1.8,zoom+.15);
});
document.getElementById('zout').addEventListener('click',()=>{
 zoom=Math.max(.55,zoom-.15);
});

// Oyun alanına dokununca yakındaki yerle etkileşim
canvas.addEventListener('click',interact);

// Oyun döngüsü
let lastTime=0;
function loop(time){
 requestAnimationFrame(loop);
 const dt=Math.min((time-lastTime)/1000||0,.04);
 lastTime=time;

 const speed=10;
 player.x+=joyX*speed*dt;
 player.y+=joyY*speed*dt;
 player.x=Math.max(-39,Math.min(39,player.x));
 player.y=Math.max(-39,Math.min(39,player.y));

 if(Math.abs(joyX)+Math.abs(joyY)>.1){
  player.dir=Math.atan2(joyX,joyY);
 }

 drawWorld();
}
refresh();
requestAnimationFrame(loop);
</script>
</body>
</html>
