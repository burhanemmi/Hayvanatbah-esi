<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hayvanat Bahçem</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#8acb78;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
#loading{position:fixed;inset:0;z-index:20;background:#163d2b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#loading h1{font-size:30px;margin:0 0 12px}
#loading p{color:#d5ead9}
#loading button{display:none;padding:12px 20px;border:0;border-radius:12px;background:#e9b84c;font-weight:bold}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#153d2bdc;padding:10px 13px;border-radius:14px;font-size:14px;box-shadow:0 3px 12px #0002}
#menu{position:fixed;right:12px;top:64px;display:flex;flex-direction:column;gap:8px}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:#f3c65e;color:#243a23;font-weight:bold;font-size:14px;box-shadow:0 3px 8px #0003}
#menu button{background:#174a32;color:white}
#notice{position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#153d2b;padding:10px 14px;border-radius:12px;display:none;max-width:85%;text-align:center}
#joystick{position:fixed;left:22px;bottom:28px;width:124px;height:124px;border-radius:50%;background:#ffffff32;border:2px solid #ffffff85;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff9;border:2px solid white}
#lookHint{position:fixed;right:15px;bottom:18px;background:#153d2b99;border-radius:10px;padding:8px;font-size:11px;pointer-events:none}
#actions{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px}
#actions button{padding:12px 10px}
#panel{position:fixed;inset:0;background:#071d13bb;display:none;align-items:center;justify-content:center;padding:18px}
#panelCard{width:min(360px,100%);background:#17452f;border:1px solid #78a889;border-radius:20px;padding:20px}
#panelCard h2{margin-top:0}
.animalBtn{display:block;width:100%;margin:9px 0;text-align:left;background:#f4d47c}
#close{background:#d6e4d8}
@media(max-width:420px){#hud .pill{font-size:12px;padding:9px}#actions{bottom:164px}#actions button{font-size:12px;padding:10px 9px}#lookHint{bottom:22px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">
  <h1>🐘 Hayvanat Bahçem</h1>
  <p id="loadText">Oyun başlatılıyor...</p>
  <button id="retry">Tekrar dene</button>
</div>
<div id="hud">
  <div class="pill">🌿 Hayvanat Bahçem</div>
  <div class="pill">🪙 <span id="money">500</span></div>
</div>
<div id="menu">
  <button id="animals">🐾 Hayvanlar</button>
  <button id="earn">🎟️ Bilet geliri +50</button>
</div>
<div id="notice"></div>
<div id="joystick"><div id="knob"></div></div>
<div id="lookHint">Ekranın sağ tarafını sürükle: etrafa bak</div>
<div id="actions">
  <button id="inspect">🔎 İncele</button>
  <button id="feed">🥕 Besle · 10</button>
</div>
<div id="panel">
  <div id="panelCard">
    <h2>🐾 Hayvan satın al</h2>
    <p>Yeni hayvanları bahçene ekle.</p>
    <button class="animalBtn" data-animal="lion" data-cost="150">🦁 Aslan — 150 🪙</button>
    <button class="animalBtn" data-animal="elephant" data-cost="200">🐘 Fil — 200 🪙</button>
    <button class="animalBtn" data-animal="flamingo" data-cost="80">🦩 Flamingo — 80 🪙</button>
    <button class="animalBtn" data-animal="panda" data-cost="180">🐼 Panda — 180 🪙</button>
    <button id="close">Kapat</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const loading=document.getElementById("loading");
const loadText=document.getElementById("loadText");
const retry=document.getElementById("retry");
const notice=document.getElementById("notice");
let scene,camera,renderer,clock;
let money=500;
let animals=[];
let joyX=0,joyY=0;
let yaw=0,pitch=0;
let dragging=false,lastX=0,lastY=0;
const keys={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function message(text){
  notice.textContent=text;
  notice.style.display="block";
  clearTimeout(message.timer);
  message.timer=setTimeout(()=>notice.style.display="none",2400);
}
function setMoney(n){
  money=n;
  document.getElementById("money").textContent=money;
}
function mat(color,roughness=1){
  return new THREE.MeshStandardMaterial({color,roughness});
}
function box(parent,x,y,z,sx,sy,sz,color){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function ball(parent,x,y,z,sx,sy,sz,color){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),mat(color));
  m.position.set(x,y,z);m.scale.set(sx,sy,sz);
  m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function cylinder(parent,x,y,z,r1,r2,h,color,segments=10){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),mat(color));
  m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
function makeTree(x,z,size=1){
  const g=new THREE.Group();
  cylinder(g,0,size,0,.18*size,.28*size,2*size,0x765033);
  ball(g,0,2.35*size,0,1.05*size,1.25*size,1.0*size,0x397a3d);
  ball(g,-.55*size,2.05*size,.1, .65*size,.72*size,.65*size,0x4d9147);
  ball(g,.55*size,2.2*size,-.1,.7*size,.8*size,.7*size,0x2e6935);
  g.position.set(x,0,z);scene.add(g);
}
function makeFence(x,z,w,d){
  const wood=0x91643d;
  for(let xx=-w/2;xx<=w/2+.01;xx+=1.5){
    box(scene,x+xx,.65,z-d/2,.12,1.3,.12,wood);
    box(scene,x+xx,.65,z+d/2,.12,1.3,.12,wood);
  }
  for(let zz=-d/2;zz<=d/2+.01;zz+=1.5){
    box(scene,x-w/2,.65,z+zz,.12,1.3,.12,wood);
    box(scene,x+w/2,.65,z+zz,.12,1.3,.12,wood);
  }
  for(const y of [.4,1]){
    box(scene,x,.0+y,z-d/2,w,.12,.12,wood);
    box(scene,x,.0+y,z+d/2,w,.12,.12,wood);
    box(scene,x-w/2,y,z,.12,.12,d,wood);
    box(scene,x+w/2,y,z,.12,.12,d,wood);
  }
}
function makeAnimal(type,x,z){
  const g=new THREE.Group();
  const colors={lion:0xc58b40,elephant:0x858f91,flamingo:0xf18d9e,panda:0xf0eee4};
  const c=colors[type]||0xc58b40;
  if(type==="lion"){
    ball(g,0,1.15,0,.72,.68,.85,0x9a5b2b);
    ball(g,0,1.2,.5,.53,.48,.48,c);
    ball(g,0,1.12,.88,.28,.23,.17,0xe7c48c);
    ball(g,-.19,1.3,.96,.06,.06,.05,0x161616);
    ball(g,.19,1.3,.96,.06,.06,.05,0x161616);
    for(const [a,b] of [[-.45,.55],[.45,.55],[-.45,-.48],[.45,-.48]]){
      cylinder(g,a,.36,b,.13,.16,.6,c);
    }
    ball(g,0,1.55,-.25,.7,.7,.65,0x8d4d22);
    ball(g,0,1.65,-.25,.56,.56,.56,c);
    cylinder(g,.05,.8,-.85,.06,.08,.65,0x8d4d22);
  }else if(type==="elephant"){
    ball(g,0,1.35,0,.85,.85,1.05,c);
    ball(g,0,1.8,.7,.58,.58,.55,c);
    ball(g,-.58,1.65,.58,.42,.48,.12,0x737d80);
    ball(g,.58,1.65,.58,.42,.48,.12,0x737d80);
    cylinder(g,0,1.18,1.12,.16,.23,.8,c,12).rotation.x=-.22;
    for(const a of [-.5,.5])for(const b of [-.62,.62])box(g,a,.42,b,.28,.8,.3,0x777f82);
    ball(g,0,1.95,1.03,.08,.08,.06,0x171717);
  }else if(type==="flamingo"){
    ball(g,0,.72,0,.32,.45,.45,0xf18d9e);
    cylinder(g,0,1.15,.18,.09,.12,.75,0xf18d9e,10);
    ball(g,0,1.55,.18,.23,.22,.23,0xf18d9e);
    cylinder(g,.12,1.51,.38,.035,.06,.24,0xe9a15c,8).rotation.x=Math.PI/2;
    cylinder(g,-.12,.3,0,.035,.045,.6,0xf18d9e);
    cylinder(g,.12,.3,.08,.035,.045,.6,0xf18d9e);
    box(g,0,.04,-.08,.42,.07,.24,0x292929);
  }else{
    ball(g,0,1.05,0,.62,.65,.62,0xf0eee4);
    ball(g,0,1.72,.12,.48,.46,.45,0xf0eee4);
    ball(g,-.32,2,.1,.16,.18,.12,0x171717);
    ball(g,.32,2,.1,.16,.18,.12,0x171717);
    ball(g,-.17,1.78,.49,.12,.18,.07,0x171717);
    ball(g,.17,1.78,.49,.12,.18,.07,0x171717);
    ball(g,0,1.62,.53,.09,.06,.05,0x171717);
    for(const a of [-.38,.38])for(const b of [-.35,.35])cylinder(g,a,.3,b,.13,.16,.5,0x202020);
  }
  g.position.set(x,0,z);
  g.userData.type=type;
  g.userData.baseY=0;
  scene.add(g);
  animals.push(g);
  return g;
}
function createWorld(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x9bd8f5);
  scene.fog=new THREE.Fog(0x9bd8f5,35,105);
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,250);
  camera.position.set(0,1.7,12);
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"default"});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  document.getElementById("game").replaceChildren(renderer.domElement);
  clock=new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0xdaf2ff,0x5c7138,2));
  const sun=new THREE.DirectionalLight(0xfff0cf,2.3);
  sun.position.set(-15,25,10);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);

  const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x6fb65b));
  ground.rotation.x=-Math.PI/2;ground.position.y=-.08;
  ground.receiveShadow=true;scene.add(ground);

  // Ana yürüyüş yolları
  box(scene,0,.005,5,9,.035,110,0xc7b48a);
  box(scene,0,.006,-18,70,.035,7,0xc7b48a);
  box(scene,-19,.006,0,6,.035,45,0xc7b48a);
  box(scene,19,.006,0,6,.035,45,0xc7b48a);

  // Gölet
  const pond=new THREE.Mesh(new THREE.CircleGeometry(5,32),
    new THREE.MeshStandardMaterial({color:0x45b7d4,roughness:.25,metalness:.12}));
  pond.rotation.x=-Math.PI/2;pond.position.set(-10,.02,-8);scene.add(pond);
  for(let i=0;i<14;i++){
    const a=i/14*Math.PI*2;
    const rock=ball(scene,-10+Math.cos(a)*5.3,.1,-8+Math.sin(a)*5.3,.35,.22,.3,0x9caa80);
  }

  // Çitli yaşam alanları
  makeFence(0,-8,13,12);
  makeFence(19,-8,12,12);
  makeFence(-19,-8,11,12);
  makeFence(0,-29,13,12);
  makeFence(19,-29,12,12);

  // Çeşitli ağaçlar
  for(let i=0;i<65;i++){
    const x=(Math.random()-.5)*100;
    const z=(Math.random()-.5)*100;
    if(Math.abs(x)<7||Math.abs(x-19)<7||Math.abs(x+19)<7)continue;
    if(z> -3&&z<12)continue;
    makeTree(x,z,.65+Math.random()*.6);
  }

  // Başlangıç hayvanları
  makeAnimal("lion",-2,-8);
  makeAnimal("elephant",18,-8);
  makeAnimal("flamingo",-19,-8);
  makeAnimal("panda",1,-29);
  makeAnimal("flamingo",19,-29);

  // Banklar
  for(const [x,z] of [[7,3],[-7,-2],[7,-18],[-8,-25]]){
    box(scene,x,.45,z,2,.18,.65,0x87542e);
    box(scene,x,.25,z-.2, .15,.5,.15,0x644126);
    box(scene,x,.25,z+.2, .15,.5,.15,0x644126);
  }
  // Giriş kemeri
  box(scene,0,2,13,7,.35,.4,0x81512d);
  box(scene,-3.2,1,13,.35,2,.4,0x81512d);
  box(scene,3.2,1,13,.35,2,.4,0x81512d);

  loading.style.display="none";
  message("Hayvanat bahçene hoş geldin! Joystick ile hareket et.");
}
function updateCamera(){
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}
function animate(){
  requestAnimationFrame(animate);
  if(!renderer||!scene)return;
  const dt=Math.min(clock.getDelta(),.05);
  let forward=-joyY;
  let side=joyX;
  if(keys.w||keys.arrowup)forward+=1;
  if(keys.s||keys.arrowdown)forward-=1;
  if(keys.d||keys.arrowright)side+=1;
  if(keys.a||keys.arrowleft)side-=1;
  const length=Math.hypot(forward,side);
  if(length>1){forward/=length;side/=length}
  const speed=7*dt;
  camera.position.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed;
  camera.position.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed;
  camera.position.x=clamp(camera.position.x,-78,78);
  camera.position.z=clamp(camera.position.z,-78,78);
  camera.position.y=1.7;
  updateCamera();
  animals.forEach((a,i)=>{a.position.y=Math.sin(performance.now()*.0015+i)*.025});
  renderer.render(scene,camera);
}
function start(){
  try{
    loadText.textContent="Doğal yaşam alanı hazırlanıyor...";
    retry.style.display="none";
    createWorld();
    animate();
  }catch(e){
    console.error(e);
    loadText.textContent="Oyun başlatılamadı: "+(e.message||"Bilinmeyen hata");
    retry.style.display="block";
  }
}
retry.addEventListener("click",()=>location.reload());
window.addEventListener("resize",()=>{
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

// Mobil joystick
const joystick=document.getElementById("joystick");
const knob=document.getElementById("knob");
let joyActive=false;
function joystickMove(e){
  if(!joyActive)return;
  const r=joystick.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const dx=e.clientX-cx,dy=e.clientY-cy;
  const max=37,dist=Math.hypot(dx,dy),scale=dist>max?max/dist:1;
  const x=dx*scale,y=dy*scale;
  knob.style.left=(r.width/2-25+x)+"px";
  knob.style.top=(r.height/2-25+y)+"px";
  joyX=x/max;joyY=y/max;
}
joystick.addEventListener("pointerdown",e=>{
  joyActive=true;joystick.setPointerCapture(e.pointerId);joystickMove(e);
});
joystick.addEventListener("pointermove",joystickMove);
function endJoy(){
  joyActive=false;joyX=0;joyY=0;
  knob.style.left="35px";knob.style.top="35px";
}
joystick.addEventListener("pointerup",endJoy);
joystick.addEventListener("pointercancel",endJoy);

// Sağ tarafta sürükleyerek etrafa bak
rendererSafeLook();
function rendererSafeLook(){
  document.addEventListener("pointerdown",e=>{
    if(e.clientX>innerWidth*.42&&!e.target.closest("button")&&!e.target.closest("#joystick")&&!e.target.closest("#panel")){
      dragging=true;lastX=e.clientX;lastY=e.clientY;
    }
  });
  document.addEventListener("pointermove",e=>{
    if(!dragging)return;
    yaw-=(e.clientX-lastX)*.005;
    pitch=clamp(pitch-(e.clientY-lastY)*.004,-1.15,1.15);
    lastX=e.clientX;lastY=e.clientY;
  });
  document.addEventListener("pointerup",()=>dragging=false);
  document.addEventListener("pointercancel",()=>dragging=false);
}

document.getElementById("animals").onclick=()=>document.getElementById("panel").style.display="flex";
document.getElementById("close").onclick=()=>document.getElementById("panel").style.display="none";
document.querySelectorAll(".animalBtn").forEach(btn=>{
  btn.onclick=()=>{
    const cost=Number(btn.dataset.cost);
    if(money<cost){message("Yeterli paran yok!");return}
    setMoney(money-cost);
    const type=btn.dataset.animal;
    const x=clamp(camera.position.x+Math.sin(yaw)*-5,-70,70);
    const z=clamp(camera.position.z-Math.cos(yaw)*5,-70,70);
    makeAnimal(type,x,z);
    document.getElementById("panel").style.display="none";
    message("Yeni hayvanın bahçene eklendi!");
  };
});
document.getElementById("earn").onclick=()=>{
  setMoney(money+50);message("Biletlerden 50 altın kazandın!");
};
document.getElementById("inspect").onclick=()=>{
  let closest=null,best=Infinity;
  animals.forEach(a=>{
    const d=Math.hypot(a.position.x-camera.position.x,a.position.z-camera.position.z);
    if(d<best){best=d;closest=a}
  });
  if(closest&&best<12){
    const names={lion:"Aslan",elephant:"Fil",flamingo:"Flamingo",panda:"Panda"};
    message(names[closest.userData.type]+" · Mesafe: "+best.toFixed(1)+" m");
  }else message("Yakında hayvan yok. Çitli alanlara yaklaş.");
};
document.getElementById("feed").onclick=()=>{
  if(money<10){message("Beslemek için 10 altın gerekiyor.");return}
  let closest=null,best=Infinity;
  animals.forEach(a=>{
    const d=Math.hypot(a.position.x-camera.position.x,a.position.z-camera.position.z);
    if(d<best){best=d;closest=a}
  });
  if(closest&&best<12){
    setMoney(money-10);message("Hayvanı besledin! 🥕");
  }else message("Önce bir hayvana yaklaş.");
};

start();
</script>
</body>
</html>
