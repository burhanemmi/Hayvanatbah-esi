<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hayvanat Bahçem</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#85c963;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{border:0;border-radius:10px;padding:10px;background:#eaf5e4;color:#183c25;font-weight:bold;font-size:13px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
#hud{position:fixed;z-index:4;top:6px;left:6px;display:flex;gap:5px;pointer-events:none}
.stat{background:#16452de8;color:white;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:bold}
#menuToggle{position:fixed;z-index:12;right:7px;top:7px;width:43px;height:42px;font-size:23px;padding:0;background:white;box-shadow:0 2px 8px #0004}
#menuPanel{display:none;position:fixed;z-index:11;right:7px;top:55px;width:min(300px,86vw);max-height:75vh;overflow-y:auto;background:#fffffff2;border-radius:14px;padding:11px;box-shadow:0 4px 20px #0005;touch-action:pan-y}
#menuPanel.open{display:block}
.menuTitle{font-size:17px;font-weight:bold;color:#21522e;margin:3px 0 10px}
.menuTab{display:block;width:100%;text-align:left;margin:6px 0;background:#e2f1da;font-size:14px}
.subPanel{display:none;padding:7px;background:#f6faef;border-radius:10px;margin:5px 0 9px}
.subPanel.open{display:block}
.animalGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.animalGrid button{font-size:11px;padding:9px 4px}
#message{position:fixed;z-index:4;top:52px;left:50%;transform:translateX(-50%);background:#173d2ce8;color:white;border-radius:10px;padding:7px 10px;font-size:12px;text-align:center;max-width:75vw;pointer-events:none}
#goal{position:fixed;z-index:3;left:7px;top:48px;background:#fffde8e8;color:#29452b;border-radius:9px;padding:6px 8px;font-size:11px;pointer-events:none}
#joystick{position:fixed;z-index:6;bottom:12px;left:12px;width:92px;height:92px;border-radius:50%;background:#ffffff70;border:3px solid #ffffffc9;touch-action:none}
#stick{position:absolute;left:23px;top:23px;width:40px;height:40px;border-radius:50%;background:#1c6b39e8;border:3px solid white;pointer-events:none}
#actions{position:fixed;z-index:6;right:9px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#actions button{width:70px;min-height:40px;background:#fffff0ed;font-size:11px;padding:6px}
#kioskOverlay{display:none;position:fixed;z-index:20;inset:0;background:#102c1bcc;align-items:center;justify-content:center;padding:10px}
#kioskCard{width:min(430px,96vw);max-height:90vh;overflow:auto;background:#fffdf2;border-radius:16px;padding:14px;touch-action:pan-y}
#kioskCard h2{margin:0 0 8px;color:#24522d;font-size:20px}
#kioskProducts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.product{background:#eaf5e5;border-radius:10px;padding:9px;text-align:center;font-size:12px}
.product strong{display:block;margin-bottom:5px}
.product button{width:100%;margin-top:6px;font-size:11px}
#kioskStock{font-size:12px}
#kioskClose{width:100%;margin-top:8px;background:#235b34;color:white}
#kioskOpen{width:100%;margin-top:8px}
#rotateOverlay{display:none;position:fixed;inset:0;z-index:100;background:#17472b;color:white;align-items:center;justify-content:center;text-align:center;padding:22px}
#rotateOverlay h1{font-size:26px}
#rotateOverlay p{line-height:1.5}
#rotateButton{background:#e7f5d9}
@media (orientation:portrait){#rotateOverlay{display:flex}}
@media (orientation:landscape) and (max-height:500px){
 #hud{top:4px;left:4px;gap:3px}
 .stat{font-size:10px;padding:5px 6px}
 #menuToggle{top:4px;right:4px;width:38px;height:36px}
 #menuPanel{top:44px;max-height:78vh}
 #goal{top:39px;font-size:10px}
 #message{top:43px;font-size:11px}
 #joystick{width:78px;height:78px;left:8px;bottom:8px}
 #stick{left:17px;top:17px;width:38px;height:38px}
 #actions{right:7px;bottom:8px}
 #actions button{width:62px;min-height:34px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="stat">🐾 Sv. <span id="level">1</span></div>
 <div class="stat">💰 <span id="money">500</span> ₺</div>
 <div class="stat">⭐ <span id="xp">0</span></div>
</div>

<button id="menuToggle" aria-label="Menüyü aç">☰</button>
<div id="menuPanel">
 <div class="menuTitle">🐾 Hayvanat Bahçem</div>

 <button class="menuTab" id="animalsTab">🐾 Hayvanlar <span id="animalsArrow">＋</span></button>
 <div class="subPanel" id="animalsPanel">
  <div class="animalGrid">
   <button data-buy="turtle">🐢 Kaplumbağa<br>100 ₺</button>
   <button data-buy="rabbit">🐇 Tavşan<br>150 ₺</button>
   <button data-buy="cat">🐈 Kedi<br>200 ₺</button>
   <button data-buy="dog">🐕 Köpek<br>250 ₺</button>
   <button data-buy="monkey">🐒 Maymun<br>350 ₺</button>
   <button data-buy="hippo">🦛 Su aygırı<br>500 ₺</button>
   <button data-buy="giraffe">🦒 Zürafa<br>650 ₺</button>
   <button data-buy="elephant">🐘 Fil<br>800 ₺</button>
   <button data-buy="lion">🦁 Aslan<br>1000 ₺</button>
  </div>
 </div>

 <button class="menuTab" id="kioskTab">🏪 Büfe ve ürünler</button>
 <button class="menuTab" id="careTab">🧹 Hayvan bakımı</button>
 <button class="menuTab" id="goalTab">🎯 Hedefler ve bilgiler</button>
 <button class="menuTab" id="zoomTab">🔎 Kamera yakınlaştır</button>
 <button class="menuTab" id="closeMenu">✖ Menüyü kapat</button>
 <div style="font-size:11px;line-height:1.4;margin-top:8px">Joystick ile yürü. Çöpleri topla, büfede satış yap ve kazancınla hayvan satın al.</div>
</div>

<div id="message">Hayvanat bahçene hoş geldin!</div>
<div id="goal">🎯 Bahçeni büyüt!</div>
<div id="joystick"><div id="stick"></div></div>
<div id="actions">
 <button id="interactButton">🤝 Etkileşim</button>
 <button id="cleanButton">🧹 Temizle</button>
</div>

<div id="kioskOverlay">
 <div id="kioskCard">
  <h2>🏪 Büfe</h2>
  <p style="font-size:12px">Ürün satın al, büfeyi aç ve ziyaretçilere satış yap.</p>
  <div id="kioskProducts"></div>
  <p id="kioskStock"></p>
  <button id="kioskOpen">🟢 Büfeyi aç</button>
  <button id="kioskClose">Bahçeye dön</button>
 </div>
</div>

<div id="rotateOverlay">
 <div>
  <div style="font-size:50px">📱 ↻</div>
  <h1>Telefonunu yatay çevir</h1>
  <p>Oyun yatay ekranda daha rahat oynanır.</p>
  <button id="rotateButton">Yatay ekranı dene</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
const canvas=$('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d7f0);
scene.fog=new THREE.Fog(0x91d7f0,55,125);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,250);
camera.position.set(0,10,15);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;

scene.add(new THREE.HemisphereLight(0xffffff,0x527548,2.1));
const sun=new THREE.DirectionalLight(0xffffff,1.7);
sun.position.set(-15,25,12);
scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});
const grass=mat(0x70bf58),road=mat(0xd6c9a5);
const pathMat=mat(0xc3ad81),fenceMat=mat(0xf1e6c9);
const leafMat=mat(0x27834a),trunkMat=mat(0x79502d);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),grass);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.15;
floor.receiveShadow=false;
scene.add(floor);

function box(x,y,z,sx,sy,sz,m){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);
 o.position.set(x,y,z);o.receiveShadow=false;scene.add(o);return o;
}
function cylinder(x,y,z,r1,r2,h,m,n=9){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),m);
 o.position.set(x,y,z);scene.add(o);return o;
}
function path(x,z,w,d,m=pathMat){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,.06,d),m);
 o.position.set(x,.04,z);scene.add(o);
}
path(0,0,5,90,road);
path(0,0,70,4,road);
path(-17,0,3,60);path(17,0,3,60);

function tree(x,z){
 cylinder(x,1,z,.23,.32,2,trunkMat,7);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.1,8,7),leafMat);
 crown.position.set(x,2.5,z);scene.add(crown);
}
for(let i=0;i<65;i++){
 const x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;
 if(Math.abs(x)<22&&Math.abs(z)<30)continue;
 tree(x,z);
}

const pens={
 turtle:{x:-27,z:-18,w:10,d:9},
 rabbit:{x:-13,z:-18,w:10,d:9},
 cat:{x:1,z:-18,w:10,d:9},
 dog:{x:15,z:-18,w:10,d:9},
 monkey:{x:-27,z:3,w:10,d:9},
 hippo:{x:-13,z:3,w:10,d:9},
 giraffe:{x:1,z:3,w:10,d:9},
 elephant:{x:15,z:3,w:10,d:9},
 lion:{x:28,z:3,w:10,d:9}
};
for(const p of Object.values(pens))path(p.x,p.z,p.w+.5,p.d+.5,mat(0x91cc67));

function fence(p){
 const h=.65,m=fenceMat;
 for(let x=p.x-p.w/2;x<=p.x+p.w/2+.1;x+=1.1){
  box(x,h/2,p.z-p.d/2,.07,h,.07,m);
  box(x,h/2,p.z+p.d/2,.07,h,.07,m);
 }
 for(let z=p.z-p.d/2;z<=p.z+p.d/2+.1;z+=1.1){
  box(p.x-p.w/2,h/2,z,.07,h,.07,m);
  box(p.x+p.w/2,h/2,z,.07,h,.07,m);
 }
 box(p.x,.45,p.z-p.d/2,p.w,.09,.09,m);
 box(p.x,.45,p.z+p.d/2,p.w,.09,.09,m);
}
for(const p of Object.values(pens))fence(p);

const names={turtle:'Kaplumbağa',rabbit:'Tavşan',cat:'Kedi',dog:'Köpek',monkey:'Maymun',hippo:'Su aygırı',giraffe:'Zürafa',elephant:'Fil',lion:'Aslan'};
const colors={turtle:0x398d45,rabbit:0xe8ddcb,cat:0x9a9a9a,dog:0xc58b50,monkey:0x8c5c37,hippo:0x8b98a5,giraffe:0xd9a52d,elephant:0x8e999f,lion:0xd18b2c};
const prices={turtle:100,rabbit:150,cat:200,dog:250,monkey:350,hippo:500,giraffe:650,elephant:800,lion:1000};
const animalGroups={};

function makeAnimal(type,p,count=3){
 const group=new THREE.Group(),color=colors[type];
 for(let i=0;i<count;i++){
  const a=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(type==='elephant'?.65:.42,12,9),mat(color));
  body.position.y=type==='giraffe'?1.05:.55;
  body.scale.set(1.25,1,1.55);a.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(type==='elephant'?.38:.29,12,9),mat(color));
  head.position.set(0,type==='giraffe'?2:.85,.42);a.add(head);
  if(type==='giraffe'){
   const neck=new THREE.Mesh(new THREE.CylinderGeometry(.13,.18,.95,8),mat(color));
   neck.position.set(0,1.45,.28);a.add(neck);
  }
  if(type==='elephant'){
   const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,.65,8),mat(color));
   trunk.position.set(0,.52,.72);trunk.rotation.x=-.3;a.add(trunk);
  }
  if(type==='lion'){
   const mane=new THREE.Mesh(new THREE.SphereGeometry(.4,10,8),mat(0x79451e));
   mane.position.set(0,.91,.42);a.add(mane);
  }
  if(type==='rabbit'){
   for(const side of [-1,1]){
    const ear=new THREE.Mesh(new THREE.SphereGeometry(.09,7,6),mat(color));
    ear.scale.set(.7,2.2,.7);ear.position.set(side*.13,1.22,.43);a.add(ear);
   }
  }
  for(let j=0;j<4;j++){
   const leg=new THREE.Mesh(new THREE.CylinderGeometry(.07,.08,.34,7),mat(color));
   leg.position.set(j%2===0?-.22:.22,.24,j<2?-.25:.3);a.add(leg);
  }
  a.position.set(p.x+(Math.random()-.5)*(p.w-2),0,p.z+(Math.random()-.5)*(p.d-2));
  a.rotation.y=Math.random()*Math.PI*2;group.add(a);
 }
 scene.add(group);return group;
}
animalGroups.turtle=makeAnimal('turtle',pens.turtle);
animalGroups.rabbit=makeAnimal('rabbit',pens.rabbit);
const player=new THREE.Group();
const playerBody=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.65,4,8),mat(0x2767d8));
playerBody.position.y=.75;player.add(playerBody);
const playerHead=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),mat(0xffd1a2));
playerHead.position.y=1.35;player.add(playerHead);
scene.add(player);
player.position.set(0,0,8);
player.rotation.y=Math.PI;

const visitors=[];
const hairColors=[0x17120f,0x51331d,0xc99a4c,0xb95727];
function makeVisitor(){
 const g=new THREE.Group();
 const shirtColors=[0xe85d55,0x3c77d4,0xe7bb42,0x7a4ca1,0x41a58b];
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.23,.42,3,7),mat(shirtColors[Math.floor(Math.random()*shirtColors.length)]));
 torso.position.y=.6;g.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.19,9,8),mat(0xf1c29a));
 head.position.y=1.08;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.2,9,8),mat(hairColors[Math.floor(Math.random()*hairColors.length)]));
 hair.scale.set(1,Math.random()>.5?.55:1.05,1);hair.position.y=1.19;g.add(hair);
 for(let i=0;i<2;i++){
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,.35,6),mat(0x33435b));
  leg.position.set(i===0?-.11:.11,.18,0);g.add(leg);
 }
 const angle=Math.random()*Math.PI*2,r=8+Math.random()*18;
 g.position.set(Math.cos(angle)*r,0,Math.sin(angle)*r);
 scene.add(g);
 visitors.push({g,wait:Math.random()*4,dir:Math.random()*Math.PI*2});
}
for(let i=0;i<18;i++)makeVisitor();

const trash=[];
function makeTrash(){
 const g=new THREE.Group();
 const can=new THREE.Mesh(new THREE.CylinderGeometry(.12,.1,.25,8),mat(0xffe4a1));
 can.position.y=.13;g.add(can);
 const lid=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.04,8),mat(0x637b6b));
 lid.position.y=.27;g.add(lid);
 g.position.set((Math.random()-.5)*34,0,(Math.random()-.5)*38);
 if(Math.abs(g.position.x)<3&&Math.abs(g.position.z)<4)g.position.x+=6;
 scene.add(g);trash.push(g);
}
for(let i=0;i<24;i++)makeTrash();

const products={
 cola:{name:'🥤 Kola',cost:10,price:18},
 seeds:{name:'🌻 Ay çekirdeği',cost:8,price:15},
 burger:{name:'🍔 Hamburger',cost:20,price:35}
};
const inventory={cola:0,seeds:0,burger:0};
let money=500,xp=0,level=1,zoom=15,salesOpen=false;

function say(t){$('message').textContent=t;}
function updateHUD(){
 $('money').textContent=money;
 $('xp').textContent=xp;
 $('level').textContent=level;
 $('goal').textContent=`🎯 Seviye ${level} · Bahçeni büyüt!`;
}
function addXP(n){
 xp+=n;
 if(xp>=level*100){
  xp-=level*100;level++;money+=50;
  say('Seviye atladın! 50 ₺ kazandın.');
 }
 updateHUD();
}

function buyAnimal(type){
 if(animalGroups[type]){
  say('Bu hayvan zaten bahçende var.');return;
 }
 if(money<prices[type]){
  say('Yeterli paran yok!');return;
 }
 money-=prices[type];
 animalGroups[type]=makeAnimal(type,pens[type]);
 addXP(25);updateHUD();
 say(names[type]+' satın aldın!');
 $('animalsPanel').classList.remove('open');
 $('animalsArrow').textContent='＋';
 $('menuPanel').classList.remove('open');
}
document.querySelectorAll('[data-buy]').forEach(b=>{
 b.onclick=()=>buyAnimal(b.dataset.buy);
});

$('menuToggle').onclick=()=>{
 $('menuPanel').classList.toggle('open');
};
$('closeMenu').onclick=()=>{
 $('menuPanel').classList.remove('open');
};
$('animalsTab').onclick=()=>{
 const panel=$('animalsPanel');
 panel.classList.toggle('open');
 $('animalsArrow').textContent=panel.classList.contains('open')?'－':'＋';
};
$('kioskTab').onclick=()=>{
 openKiosk();
 $('menuPanel').classList.remove('open');
};
$('careTab').onclick=()=>{
 if(money<10){say('Bakım için 10 ₺ gerekiyor.');return;}
 if(!Object.keys(animalGroups).length){say('Önce hayvan satın al.');return;}
 money-=10;addXP(10);
 say('Hayvanların bakımı yapıldı!');
};
$('goalTab').onclick=()=>{
 say(`Seviye ${level}. Sonraki seviye için ${level*100-xp} XP gerekiyor.`);
};
$('zoomTab').onclick=()=>{
 zoom=zoom>12?9:15;
 say(zoom<12?'Kamera yaklaştırıldı.':'Kamera uzaklaştırıldı.');
};

$('interactButton').onclick=()=>{
 if(player.position.distanceTo(new THREE.Vector3(0,0,0))<9)openKiosk();
 else sellVisit();
};
$('cleanButton').onclick=cleanNearby;

function openKiosk(){
 $('kioskOverlay').style.display='flex';
 renderKiosk();
}
$('kioskClose').onclick=()=>{
 $('kioskOverlay').style.display='none';
};
$('kioskOpen').onclick=()=>{
 salesOpen=!salesOpen;
 say(salesOpen?'Büfe açıldı, satışlar başladı.':'Büfe kapatıldı.');
 renderKiosk();
};
function renderKiosk(){
 const holder=$('kioskProducts');
 holder.innerHTML='';
 for(const [key,p] of Object.entries(products)){
  const card=document.createElement('div');
  card.className='product';
  card.innerHTML=`<strong>${p.name}</strong><div>Alış: ${p.cost} ₺</div><div>Satış: ${p.price} ₺</div><div>Stok: ${inventory[key]}</div>`;
  const buy=document.createElement('button');
  buy.textContent='5 adet al';
  buy.onclick=()=>{
   const total=p.cost*5;
   if(money<total){say('Yeterli paran yok!');return;}
   money-=total;inventory[key]+=5;
   updateHUD();renderKiosk();
   say(p.name+' stoklandı.');
  };
  card.appendChild(buy);
  holder.appendChild(card);
 }
 $('kioskStock').textContent=`Stok: Kola ${inventory.cola} · Çekirdek ${inventory.seeds} · Hamburger ${inventory.burger}`;
 $('kioskOpen').textContent=salesOpen?'🔴 Büfeyi kapat':'🟢 Büfeyi aç';
}
function sellVisit(){
 if(!salesOpen){
  say('Önce menüden büfeyi aç.');return;
 }
 const keys=Object.keys(inventory).filter(k=>inventory[k]>0);
 if(!keys.length){
  say('Stok bitti! Büfeden ürün satın al.');
  openKiosk();return;
 }
 const key=keys[Math.floor(Math.random()*keys.length)];
 inventory[key]--;
 money+=products[key].price;
 addXP(5);
 say(products[key].name+' satıldı! +'+products[key].price+' ₺');
 renderKiosk();updateHUD();
}
function cleanNearby(){
 let index=-1,dist=2;
 trash.forEach((t,i)=>{
  const d=player.position.distanceTo(t.position);
  if(d<dist){dist=d;index=i;}
 });
 if(index<0){say('Yakınında çöp yok.');return;}
 scene.remove(trash[index]);
 trash.splice(index,1);
 money+=5;addXP(5);makeTrash();updateHUD();
 say('Çöp topladın! +5 ₺');
}

/* JOYSTICK: yukarı = ileri, aşağı = geri */
const joy=$('joystick'),stick=$('stick');
let joyX=0,joyY=0,joyActive=false;

function moveStick(e){
 const r=joy.getBoundingClientRect();
 const dx=e.clientX-(r.left+r.width/2);
 const dy=e.clientY-(r.top+r.height/2);
 const max=(r.width/2)-22;
 const len=Math.hypot(dx,dy);
 const scale=len>max?max/len:1;
 const px=dx*scale,py=dy*scale;
 joyX=px/max;
 joyY=py/max;
 stick.style.left=(r.width/2-20+px)+'px';
 stick.style.top=(r.height/2-20+py)+'px';
}
joy.addEventListener('pointerdown',e=>{
 e.preventDefault();
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 moveStick(e);
});
joy.addEventListener('pointermove',e=>{
 if(joyActive)moveStick(e);
});
function resetJoy(){
 joyActive=false;joyX=0;joyY=0;
 stick.style.left=(joy.clientWidth/2-20)+'px';
 stick.style.top=(joy.clientHeight/2-20)+'px';
}
joy.addEventListener('pointerup',resetJoy);
joy.addEventListener('pointercancel',resetJoy);

/* Telefon yatay kullanım denemesi */
$('rotateButton').onclick=async()=>{
 try{
  if(screen.orientation&&screen.orientation.lock){
   await screen.orientation.lock('landscape');
  }
 }catch(e){}
};

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
});

/* OYUN DÖNGÜSÜ VE KAMERA */
let last=performance.now(),saleTimer=0;
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);
 last=now;

 if(joyX||joyY){
  const speed=7;

  // Yukarı itildiğinde joyY negatiftir; Z azalır ve karakter ileri gider.
  player.position.x+=joyX*speed*dt;
  player.position.z+=joyY*speed*dt;

  player.position.x=THREE.MathUtils.clamp(player.position.x,-40,40);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-42,42);

  // Karakter hareket ettiği yöne döner.
  player.rotation.y=Math.atan2(joyX,joyY);
 }

 // Kamera karakterin önüne değil arkasına yerleşir.
 const target=new THREE.Vector3(player.position.x,0,player.position.z);
 const behind=new THREE.Vector3(
  player.position.x-Math.sin(player.rotation.y)*zoom,
  zoom*.65,
  player.position.z-Math.cos(player.rotation.y)*zoom
 );
 camera.position.lerp(behind,.09);
 camera.lookAt(target.x,target.y+1,target.z);

 visitors.forEach(v=>{
  v.wait-=dt;
  if(v.wait<=0){
   v.dir+=(Math.random()-.5)*1.7;
   v.wait=1+Math.random()*3;
  }
  v.g.position.x+=Math.sin(v.dir)*dt*.55;
  v.g.position.z+=Math.cos(v.dir)*dt*.55;
  if(Math.abs(v.g.position.x)>36||Math.abs(v.g.position.z)>40)v.dir+=Math.PI;
  v.g.rotation.y=v.dir;
 });

 for(let i=trash.length-1;i>=0;i--){
  if(player.position.distanceTo(trash[i].position)<.8){
   scene.remove(trash[i]);
   trash.splice(i,1);
   money+=5;addXP(5);makeTrash();updateHUD();
   say('Çöp topladın! +5 ₺');
  }
 }

 saleTimer+=dt;
 if(salesOpen&&saleTimer>4){
  saleTimer=0;
  if(Math.random()<.7)sellVisit();
 }

 for(const group of Object.values(animalGroups)){
  group.children.forEach((a,i)=>{
   a.rotation.y+=Math.sin(now*.001+i)*dt*.2;
  });
 }

 renderer.render(scene,camera);
}
updateHUD();
renderKiosk();
requestAnimationFrame(animate);
</script>
</body>
</html>
