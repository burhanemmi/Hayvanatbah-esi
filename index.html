<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hayvanat Bahçem</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9e5ff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;z-index:5;color:#fff;background:#173b29dd;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.6;pointer-events:none}
#help{position:fixed;top:10px;right:10px;z-index:5;background:#ffffffdf;color:#173b29;padding:8px 10px;border-radius:10px;font-size:12px;max-width:155px}
#joystick{position:fixed;bottom:24px;left:22px;width:126px;height:126px;border-radius:50%;background:#ffffff70;border:3px solid #ffffffcc;z-index:10;touch-action:none}
#stick{position:absolute;width:52px;height:52px;border-radius:50%;background:#27794b;border:3px solid white;left:34px;top:34px;box-shadow:0 2px 7px #3338;pointer-events:none}
#zoom{position:fixed;right:14px;bottom:25px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px}
.zbtn{width:47px;height:47px;border:0;border-radius:14px;background:#173b29;color:white;font-size:28px;font-weight:bold;box-shadow:0 2px 6px #0004;touch-action:manipulation}
#zoomlabel{background:#ffffffdd;padding:5px 8px;border-radius:8px;font-size:11px}
#message{position:fixed;left:50%;bottom:165px;transform:translateX(-50%);background:#173b29e8;color:white;padding:10px 15px;border-radius:12px;z-index:8;font-size:13px;text-align:center;max-width:80%;display:none}
#shop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);background:#fff;border-radius:18px;padding:18px;z-index:20;display:none;box-shadow:0 5px 30px #0006;color:#173b29}
#shop h2{margin:0 0 8px}
.buy{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:#27824c;color:white;font-weight:bold;font-size:15px}
#close{float:right;border:0;background:#eee;border-radius:8px;padding:7px 10px}
</style>
</head>
<body>
<div id="hud">
  <b>🐾 HAYVANAT BAHÇEM</b><br>
  💰 Para: <span id="money">1000</span><br>
  🐾 Hayvanlar: <span id="count">2</span><br>
  ⭐ Seviye: <span id="level">1</span><br>
  🎯 Hedef: Hayvanlarını artır!
</div>
<div id="help">Joystick ile yürü.<br>Hayvan bölmesine veya büfeye yaklaşınca dokun.</div>
<div id="joystick"><div id="stick"></div></div>
<div id="zoom">
  <button class="zbtn" id="zin">+</button>
  <div id="zoomlabel">Yakınlaştır</div>
  <button class="zbtn" id="zout">−</button>
</div>
<div id="message"></div>
<div id="shop">
  <button id="close">Kapat ✕</button>
  <h2 id="shopTitle">Hayvan bölmesi</h2>
  <p id="shopText">Bahçeni geliştirmek için seçim yap.</p>
  <div id="shopButtons"></div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9e5ff);
scene.fog = new THREE.Fog(0xb9e5ff, 45, 125);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x638052,2));
const sun = new THREE.DirectionalLight(0xffffff,2.1);
sun.position.set(-20,35,15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(color,roughness=0.9)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x70b84e), darkGrass=mat(0x55963e), roadMat=mat(0xd6c39a),
      fenceMat=mat(0x79502d), white=mat(0xffffff), black=mat(0x292929),
      wood=mat(0x9a6238), leaf=mat(0x287b38), water=mat(0x56c9e8);

function box(w,h,d,material,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
  scene.add(m);return m;
}

// Tek bir ana zemin: üst üste binen geniş zeminlerden kaynaklı titreme yok.
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),grass);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.12;
ground.receiveShadow=true;
scene.add(ground);

// Yollar zeminden azıcık yukarıda; yüzeyler çakışmıyor.
box(6,.08,100,roadMat,0,-.04,0);
box(100,.08,6,roadMat,0,-.035,0);
box(3,.06,65,roadMat,-18,-.025,0);
box(3,.06,65,roadMat,18,-.025,0);

const pens={
  lion:{x:-29,z:-19,w:17,d:18,name:'Aslan bölmesi',animal:'🦁',price:450},
  rabbit:{x:29,z:-19,w:17,d:18,name:'Tavşan bölmesi',animal:'🐰',price:150},
  elephant:{x:-29,z:20,w:17,d:18,name:'Fil bölmesi',animal:'🐘',price:600},
  turtle:{x:29,z:20,w:17,d:18,name:'Kaplumbağa bölmesi',animal:'🐢',price:200}
};
const penMeshes={};
function fenceRect(p){
  // Bölme zemini ana zeminden yukarıda ve tek parça.
  box(p.w,.12,p.d, darkGrass,p.x,-.045,p.z);
  const y=.75, h=1.5;
  for(let i=0;i<=8;i++){
    const x=p.x-p.w/2+i*p.w/8;
    box(.13,h,.13,fenceMat,x,y,p.z-p.d/2);
    box(.13,h,.13,fenceMat,x,y,p.z+p.d/2);
  }
  for(let i=0;i<=8;i++){
    const z=p.z-p.d/2+i*p.d/8;
    box(.13,h,.13,fenceMat,p.x-p.w/2,y,z);
    box(.13,h,.13,fenceMat,p.x+p.w/2,y,z);
  }
  for(const yy of [.35,1.05]){
    box(p.w,.12,.12,fenceMat,p.x,yy,p.z-p.d/2);
    box(p.w,.12,.12,fenceMat,p.x,yy,p.z+p.d/2);
    box(.12,.12,p.d,fenceMat,p.x-p.w/2,yy,p.z);
    box(.12,.12,p.d,fenceMat,p.x+p.w/2,yy,p.z);
  }
  const sign=box(3,.9,.15,wood,p.x,1.8,p.z-p.d/2-.1);
  penMeshes[p.animal]=sign;
}
Object.values(pens).forEach(fenceRect);

// Basit 3D hayvan modelleri.
const animals=[];
function makeAnimal(type,p,offset=0){
  const g=new THREE.Group();
  g.position.set(p.x+(offset%3-1)*2,.12,p.z+(Math.floor(offset/3)-1)*2);
  scene.add(g);
  const bodyColors={lion:0xd99a39,rabbit:0xe9e4d9,elephant:0x858e9c,turtle:0x438d4b};
  const bodyMat=mat(bodyColors[type]||0xd99a39);
  function part(geo,ma,x,y,z,sx=1,sy=1,sz=1){
    const m=new THREE.Mesh(geo,ma);
    m.position.set(x,y,z);m.scale.set(sx,sy,sz);
    m.castShadow=true;g.add(m);return m;
  }
  if(type==='turtle'){
    part(new THREE.SphereGeometry(.65,16,12),mat(0x327640),0, .35,0,1,.55,1);
    part(new THREE.SphereGeometry(.3,14,10),mat(0x5cbf58),.65,.35,0);
    for(const x of [-.4,.4])for(const z of [-.38,.38])part(new THREE.SphereGeometry(.18,10,8),mat(0x5cbf58),x,.12,z);
  }else{
    part(new THREE.SphereGeometry(.65,16,12),bodyMat,0,.7,0,1.2,.72,.8);
    part(new THREE.SphereGeometry(.36,16,12),bodyMat,.65,1.05,0,1,1,1);
    for(const x of [-.4,.4])for(const z of [-.42,.42])part(new THREE.CylinderGeometry(.12,.16,.55,10),bodyMat,x,.28,z);
    if(type==='rabbit'){
      part(new THREE.SphereGeometry(.13,10,8),white,.95,1.35,-.14,.7,2.5,.7);
      part(new THREE.SphereGeometry(.13,10,8),white,.95,1.35,.14,.7,2.5,.7);
    }
    if(type==='lion')part(new THREE.SphereGeometry(.46,16,12),mat(0x8a5129),.68,1.05,0,1.1,1.1,1.1);
    if(type==='elephant')part(new THREE.CylinderGeometry(.11,.18,.65,12),mat(0x858e9c),1, .72,0,1,1,1);
    for(const z of [-.14,.14])part(new THREE.SphereGeometry(.055,8,8),black,.98,1.12,z);
  }
  animals.push({g,type,p});
  return g;
}

const owned={lion:false,rabbit:true,elephant:false,turtle:true};
const animalGroups={};
for(const [type,p] of Object.entries(pens)){
  animalGroups[type]=[];
  if(owned[type]){
    animalGroups[type].push(makeAnimal(type,p,0));
    if(type==='rabbit'||type==='turtle')animalGroups[type].push(makeAnimal(type,p,1));
  }
}

// Ağaçlar, park görünümü.
function tree(x,z){
  const trunk=mat(0x79502d);
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,1.8,8),trunk);
  t.position.set(x,.9,z);t.castShadow=true;scene.add(t);
  const top=new THREE.Mesh(new THREE.SphereGeometry(1.05,12,10),leaf);
  top.position.set(x,2.2,z);top.castShadow=true;scene.add(top);
}
for(let z=-42;z<=42;z+=10){tree(-43,z);tree(43,z);}
for(let x=-35;x<=35;x+=12){tree(x,-44);tree(x,44);}

// Büfe.
const buffet={x:0,z:-13};
box(5,2.2,3,wood,buffet.x,1.1,buffet.z);
box(5.2,.25,3.2,mat(0xe9c44d),buffet.x,2.35,buffet.z);
box(2,.7,.15,white,buffet.x,1.6,buffet.z-1.58);
box(.7,1.2,.15,mat(0xe85d43),-1,1.2,buffet.z-1.6);
box(.7,1.2,.15,mat(0x53a5e6),0,1.2,buffet.z-1.6);
box(.7,1.2,.15,mat(0x72bd62),1,1.2,buffet.z-1.6);

// Oyuncu.
const player=new THREE.Group();
const shirt=mat(0x287ed0), skin=mat(0xf0bd91), pants=mat(0x28344b);
const torso=new THREE.Mesh(new THREE.BoxGeometry(.7,1,.4),shirt);
torso.position.y=1.1;torso.castShadow=true;player.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.3,14,12),skin);
head.position.y=1.85;head.castShadow=true;player.add(head);
for(const x of [-.22,.22]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.7,.25),pants);
  leg.position.set(x,.35,0);leg.castShadow=true;player.add(leg);
}
player.position.set(0,0,9);
scene.add(player);

// Joystick: yukarı basınca z azalır, aşağı basınca z artar.
let joyX=0,joyY=0,joyActive=false,joyPointer=null;
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');
function updateJoy(e){
  const r=joystick.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const max=37,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joyX=dx/max;
  joyY=dy/max;
  stick.style.left=(37+dx)+'px';
  stick.style.top=(37+dy)+'px';
}
joystick.addEventListener('pointerdown',e=>{
  e.preventDefault();joyActive=true;joyPointer=e.pointerId;
  joystick.setPointerCapture(e.pointerId);updateJoy(e);
});
joystick.addEventListener('pointermove',e=>{
  if(joyActive&&e.pointerId===joyPointer){e.preventDefault();updateJoy(e);}
});
function stopJoy(){
  joyActive=false;joyPointer=null;joyX=0;joyY=0;
  stick.style.left='34px';stick.style.top='34px';
}
joystick.addEventListener('pointerup',stopJoy);
joystick.addEventListener('pointercancel',stopJoy);
joystick.addEventListener('lostpointercapture',stopJoy);

// Kamera yakınlaştırma / uzaklaştırma.
let zoom=10;
function clampZoom(){zoom=Math.max(4,Math.min(22,zoom));}
document.getElementById('zin').addEventListener('click',()=>{zoom-=2;clampZoom();});
document.getElementById('zout').addEventListener('click',()=>{zoom+=2;clampZoom();});

// Para ve dükkân.
let money=1000,level=1;
const moneyEl=document.getElementById('money');
const countEl=document.getElementById('count');
const levelEl=document.getElementById('level');
const shop=document.getElementById('shop');
const shopTitle=document.getElementById('shopTitle');
const shopText=document.getElementById('shopText');
const shopButtons=document.getElementById('shopButtons');
const message=document.getElementById('message');
let messageTimer;
function say(t){
  message.textContent=t;message.style.display='block';
  clearTimeout(messageTimer);
  messageTimer=setTimeout(()=>message.style.display='none',2600);
}
function refresh(){
  moneyEl.textContent=money;
  countEl.textContent=animals.length;
  level=Math.max(1,Math.floor(animals.length/2)+1);
  levelEl.textContent=level;
}
function openShop(title,desc,buttons){
  shopTitle.textContent=title;shopText.textContent=desc;
  shopButtons.innerHTML='';
  buttons.forEach(b=>{
    const el=document.createElement('button');el.className='buy';el.textContent=b.label;
    el.onclick=b.action;shopButtons.appendChild(el);
  });
  shop.style.display='block';
}
document.getElementById('close').onclick=()=>shop.style.display='none';

function buyAnimal(type){
  const p=pens[type];
  if(owned[type]){say('Bu hayvan zaten bahçende!');return;}
  if(money<p.price){say('Yeterli paran yok!');return;}
  money-=p.price;owned[type]=true;
  animalGroups[type].push(makeAnimal(type,p,0));
  refresh();shop.style.display='none';
  say(p.name+' satın alındı!');
}
function nearestTarget(){
  const px=player.position.x,pz=player.position.z;
  let best=null,dist=Infinity;
  for(const [type,p] of Object.entries(pens)){
    const d=Math.hypot(px-p.x,pz-p.z);
    if(d<dist){dist=d;best={type,p,d};}
  }
  const bd=Math.hypot(px-buffet.x,pz-buffet.z);
  if(bd<dist)best={type:'buffet',p:buffet,d:bd};
  return best;
}
let currentTarget=null;
function interact(){
  const t=nearestTarget();
  if(!t||t.d>7){say('Etkileşim için bir bölmeye veya büfeye yaklaş.');return;}
  if(t.type==='buffet'){
    openShop('🍔 Bahçe Büfesi','Büfeden gelir elde et veya bahçeni geliştir.',[
      {label:'Satış yap: +100 para',action:()=>{money+=100;refresh();shop.style.display='none';say('Büfe geliri: +100 para!');}},
      {label:'Büfeyi geliştir: 250 para',action:()=>{if(money<250){say('Yeterli paran yok!');return;}money-=250;refresh();shop.style.display='none';say('Büfe geliştirildi!');}}
    ]);
  }else{
    const p=t.p;
    if(owned[t.type]){
      openShop(p.animal+' '+p.name,'Hayvanlarınla ilgilen ve bahçeni büyüt.',[
        {label:'Hayvanlara bak: 50 para kazan',action:()=>{money+=50;refresh();shop.style.display='none';say('Hayvanların mutlu! +50 para');}},
        {label:'Yeni hayvan al: '+p.price+' para',action:()=>buyAnimal(t.type)}
      ]);
    }else{
      openShop(p.animal+' '+p.name,'Bu bölmeye yeni hayvan alabilirsin.',[
        {label:'Satın al: '+p.price+' para',action:()=>buyAnimal(t.type)}
      ]);
    }
  }
}
window.addEventListener('pointerdown',e=>{
  if(e.target.closest('#joystick')||e.target.closest('#zoom')||e.target.closest('#shop'))return;
  if(e.target===renderer.domElement){
    const t=nearestTarget();
    if(t&&t.d<7)interact();
  }
});

const clock=new THREE.Clock();
const forward=new THREE.Vector3();
const camTarget=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  const speed=7;
  // İleri: joyY negatif => z azalır. Geri: joyY pozitif => z artar.
  player.position.x+=joyX*speed*dt;
  player.position.z+=joyY*speed*dt;
  player.position.x=Math.max(-46,Math.min(46,player.position.x));
  player.position.z=Math.max(-46,Math.min(46,player.position.z));

  if(Math.abs(joyX)+Math.abs(joyY)>.08){
    player.rotation.y=Math.atan2(joyX,joyY);
  }

  // Kamera daima oyuncunun arkasında kalır; zoom butonları mesafeyi değiştirir.
  forward.set(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
  camTarget.set(
    player.position.x-forward.x*zoom,
    player.position.y+zoom*.72+2.5,
    player.position.z-forward.z*zoom
  );
  camera.position.lerp(camTarget,1-Math.exp(-dt*5));
  camera.lookAt(player.position.x,player.position.y+1.1,player.position.z);

  for(const a of animals){
    a.g.position.y=.12+Math.sin(performance.now()*.002+a.g.position.x)*.035;
  }
  renderer.render(scene,camera);
}
refresh();
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
